<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel · Control de Tareas Diarias</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="dashboard-body">
  <div class="space-bg">
    <div class="stars"></div>
    <div class="stars stars-2"></div>
    <div class="stars stars-3"></div>
    <span class="twinkle" style="top:10%; left:20%; animation-delay:0s"></span>
    <span class="twinkle" style="top:18%; left:68%; animation-delay:2.2s"></span>
    <span class="twinkle" style="top:34%; left:88%; animation-delay:4.1s"></span>
    <span class="twinkle" style="top:58%; left:12%; animation-delay:1.3s"></span>
    <span class="twinkle" style="top:72%; left:80%; animation-delay:3.7s"></span>
    <span class="twinkle" style="top:86%; left:40%; animation-delay:5.5s"></span>
    <div class="comet comet-1"></div>
    <div class="comet comet-2"></div>
    <div class="comet comet-3"></div>
    <div class="comet comet-4"></div>
    <div class="comet comet-5"></div>
  </div>

  <header class="topbar">
    <div class="topbar-left">
      <div class="logo logo-sm logo-img" aria-hidden="true">
        <img src="asterlogoblanco.png" alt="Asterlogo" />
      </div>
      <div class="brand-text">
        <h2>Control de Tareas Diarias</h2>
        <p class="role-tag" id="role-tag">—</p>
      </div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-right" id="topbar-right">
      <div class="user-chip">
        <img id="user-avatar" alt="avatar" />
        <div>
          <strong id="user-name">—</strong>
          <small id="user-username">—</small>
        </div>
      </div>
      <button class="btn-ghost" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main class="dashboard">
    <section id="panel" class="panel"></section>
  </main>

  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
