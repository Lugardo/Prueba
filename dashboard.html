<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel · Control de Tareas Diarias</title>
  <link rel="icon" type="image/png" href="faviconaster.png" />
  <link rel="apple-touch-icon" href="faviconaster.png" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body class="dashboard-body">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo logo-sm logo-img" aria-hidden="true">
        <img src="asterlogoblanco.png" alt="Asterlogo" />
      </div>
      <div class="brand-text">
        <h2>Control de Tareas Diarias</h2>
        <p class="role-tag" id="role-tag">—</p>
      </div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-right" id="topbar-right">
      <div class="user-chip">
        <img id="user-avatar" alt="avatar" />
        <div>
          <strong id="user-name">—</strong>
          <small id="user-username">—</small>
        </div>
      </div>
      <button class="btn-ghost" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main class="dashboard">
    <section id="panel" class="panel"></section>
  </main>

  <script src="js/data.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/dashboard.js?v=3"></script>
</body>
</html>
