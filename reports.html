<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reportes · Control de Tareas Diarias</title>
  <link rel="icon" type="image/png" href="faviconaster.png" />
  <link rel="apple-touch-icon" href="faviconaster.png" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
</head>
<body class="dashboard-body">
  <header class="topbar">
    <div class="topbar-left">
      <div class="logo logo-sm logo-img" aria-hidden="true">
        <img src="asterlogoblanco.png" alt="Asterlogo" />
      </div>
      <div class="brand-text">
        <h2>Reportes de tareas</h2>
        <p class="role-tag" id="role-tag">—</p>
      </div>
    </div>
    <button class="hamburger" id="hamburger" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div class="topbar-right" id="topbar-right">
      <a href="dashboard.html" class="btn-ghost">← Panel</a>
      <button class="btn-ghost" id="logout-btn">Cerrar sesión</button>
    </div>
  </header>

  <main class="dashboard">
    <section class="card">
      <h3>Filtros</h3>
      <div class="cal-filters">
        <select id="rep-user" class="cal-f-control">
          <option value="">Todos los colaboradores</option>
        </select>
        <select id="rep-status" class="cal-f-control">
          <option value="">Cualquier estado</option>
        </select>
        <label class="cal-date"><span>Desde</span><input type="date" id="rep-from"/></label>
        <label class="cal-date"><span>Hasta</span><input type="date" id="rep-to"/></label>
        <input type="text" id="rep-text" class="cal-f-control rep-search" placeholder="Buscar en tarea o comentario..." />
        <div class="cal-presets">
          <button type="button" class="btn-ghost" data-preset="today">Hoy</button>
          <button type="button" class="btn-ghost" data-preset="yesterday">Ayer</button>
          <button type="button" class="btn-ghost" data-preset="week">Esta semana</button>
          <button type="button" class="btn-ghost" data-preset="month">Este mes</button>
          <button type="button" class="btn-ghost" data-preset="clear">Limpiar</button>
        </div>
      </div>
    </section>

    <section class="card">
      <h3>Resumen</h3>
      <div class="grid-3">
        <div class="stat"><div class="num" id="rep-stat-count">0</div><div class="lbl">Tareas</div></div>
        <div class="stat"><div class="num" id="rep-stat-hours">0h 00m</div><div class="lbl">Horas trabajadas</div></div>
        <div class="stat"><div class="num" id="rep-stat-done">0</div><div class="lbl">Realizadas</div></div>
      </div>
    </section>

    <section class="card">
      <div class="rep-toolbar">
        <h3>Resultados</h3>
        <div class="rep-actions">
          <button class="btn-ok" id="rep-export-csv">📥 Exportar CSV</button>
          <button class="btn-ghost" id="rep-print">🖨 Imprimir</button>
        </div>
      </div>
      <div class="table-wrap rep-table-wrap">
        <table class="rep-table">
          <thead>
            <tr>
              <th data-sort="userName">Colaborador</th>
              <th data-sort="name">Tarea</th>
              <th data-sort="start">Inicio</th>
              <th data-sort="end">Fin</th>
              <th data-sort="timeMinutes">Tiempo</th>
              <th data-sort="status">Estado</th>
              <th data-sort="createdAt">Fecha</th>
            </tr>
          </thead>
          <tbody id="rep-tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/data.js?v=3"></script>
  <script src="js/auth.js?v=3"></script>
  <script src="js/reports.js?v=3"></script>
</body>
</html>
